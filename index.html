<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen Tycoon - Ultimate Roblox Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🍜 Ultimate Ramen Tycoon</h1>
        
        <div class="atm-section">
            <div class="wallet-display">Wallet: <span id="money" style="color:#00b894;">$0</span></div>
            <div class="vault-box">
                <h3>🏧 Vault Balance</h3>
                <div id="vault-money" class="vault-amount">$0</div>
                <button id="btn-collect" class="tycoon-pad affordable" style="width:100%;" onclick="collectVault()">Step to Collect</button>
            </div>
            <div class="stats-box">
                <p>Menu: <b id="stat-menu">Basic ($50)</b></p>
                <p>Multiplier: <b id="stat-mult">x1</b></p>
            </div>
        </div>

        <div class="restaurant-floor">
            <div id="dining-area">
                <div id="seat-0" class="seat" onclick="serveCustomer(0)"></div>
                <div id="seat-1" class="seat" onclick="serveCustomer(1)"></div>
                <div id="seat-2" class="seat" onclick="serveCustomer(2)"></div>
                <div id="seat-3" class="seat" onclick="serveCustomer(3)"></div>
                <div id="seat-4" class="seat" onclick="serveCustomer(4)"></div>
                <div id="seat-5" class="seat" onclick="serveCustomer(5)"></div>
                <div id="seat-6" class="seat" onclick="serveCustomer(6)"></div>
                <div id="seat-7" class="seat" onclick="serveCustomer(7)"></div>
                <div id="seat-8" class="seat" onclick="serveCustomer(8)"></div>
                <div id="seat-9" class="seat" onclick="serveCustomer(9)"></div>
            </div>
        </div>

        <div class="tycoon-section">
            <h3>🔴 Upgrade Pads</h3>
            <div class="pad-container">
                <div id="pad-table" class="pad-slot"></div>
                <div id="pad-recipe" class="pad-slot"></div>
                <div id="pad-auto" class="pad-slot"></div>
                <div id="pad-mult" class="pad-slot"></div>
            </div>
            
            <hr style="border: 2px solid #333; margin: 30px 0 10px 0;">
            <button class="reset-btn" onclick="resetGame()">Reset Tycoon Progress</button>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <h2 style="color: #00ff00;">👨‍💻 Boss Rafay's Terminal</h2>
        <button class="tycoon-pad affordable" onclick="cheatMoney()">Hack: +$10,000,000</button>
        <button class="reset-btn" style="color: #ff4d4d; margin-top: 15px;" onclick="closeAdmin()">Close Terminal</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
