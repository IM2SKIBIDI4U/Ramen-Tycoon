<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen Tycoon: Ultimate Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="event-toast" class="event-toast hidden">🚨 RUSH HOUR! 🚨</div>

    <div class="game-container" id="main-container">
        <h1>🍜 Ramen Monkey Tycoon</h1>
        
        <div class="top-bar glass-panel">
            <div class="wallet-display">Wallet: <span id="money" style="color:#05c46b;">$0</span></div>
            <div class="stats-box">
                Menu: <b id="stat-menu">Basic Shoyu ($50)</b><br>
                <span style="color:#f1c40f; font-size:0.9rem;">🐒 Monkey Money: <b id="stat-stars">0</b></span>
            </div>
        </div>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('kitchen')">🍳 Kitchen</button>
            <button class="tab-btn" onclick="switchTab('dining')">🍽️ Dining</button>
        </div>

        <div id="view-kitchen" class="view-panel active-view glass-panel">
            <h3>Pantry (Ingredients)</h3>
            <div class="pantry-grid">
                <div class="ing-item">🍜 Noodles: <span id="inv-noodle">10</span> <button onclick="buyIngredient('noodle', 5)">Buy ($5)</button></div>
                <div class="ing-item">🥣 Broth: <span id="inv-broth">10</span> <button onclick="buyIngredient('broth', 10)">Buy ($10)</button></div>
                <div class="ing-item">🌶️ Spice: <span id="inv-spice">10</span> <button onclick="buyIngredient('spice', 15)">Buy ($15)</button></div>
                <div class="ing-item">🥚 Egg: <span id="inv-egg">10</span> <button onclick="buyIngredient('egg', 20)">Buy ($20)</button></div>
            </div>
            <h3>Stoves</h3>
            <div id="stoves-container"></div>
            <p id="kitchen-msg" class="hidden" style="color:red; font-weight:bold;">Not enough ingredients!</p>
        </div>

        <div id="view-dining" class="view-panel glass-panel">
            <div class="outside-queue">
                <div class="door-frame">ENTRANCE</div>
            </div>
            <div id="dining-area">
                <p>Coming soon: Upgrade your dining hall!</p>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <h2 class="matrix-text">👑 GOD MODE TERMINAL</h2>
        <div style="margin-bottom: 15px;">
            <input type="number" id="custom-money" placeholder="Enter amount..." style="padding: 10px; border-radius: 5px; border:none; width: 60%;">
            <button class="god-btn" onclick="setCustomMoney()">Set Money</button>
        </div>
        <div class="admin-grid">
            <button class="god-btn" onclick="cheatMoney(1e15)">+1 Quadrillion</button>
            <button class="god-btn" onclick="adminMaxIngredients()">Infinite Ingredients</button>
        </div>
        <button class="god-btn" style="margin-top: 20px; color: #ff7675; border-color: #ff7675;" onclick="closeAdmin()">Close Panel</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
