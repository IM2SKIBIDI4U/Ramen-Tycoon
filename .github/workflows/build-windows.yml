- name: Build Desktop EXE
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v1.0.0
          releaseName: "Ramen Tycoon v1.0.0"
          releaseBody: "Automated desktop build for Windows."
          releaseDraft: true
          projectPath: ./
          tauriScript: "npx tauri" # Forces using npm/npx instead of pnpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
