<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen Tycoon: Animated Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container" id="main-container">
        <h1>🍜 Ramen Monkey Tycoon</h1>
        
        <div class="top-bar glass-panel">
            <div class="wallet-display">Wallet: <span id="money" style="color:#05c46b;">$0</span></div>
            <div class="stats-box">
                Menu: <b id="stat-menu">Basic Shoyu ($50)</b>
            </div>
        </div>

        <div class="tab-nav">
            <button class="tab-btn active" id="btn-dining" onclick="switchTab('dining')">🍽️ Dining</button>
            <button class="tab-btn" id="btn-kitchen" onclick="switchTab('kitchen')">🔥 Kitchen</button>
            <button class="tab-btn" id="btn-staff" onclick="switchTab('staff')">🐒 Staff</button>
        </div>

        <div class="pantry-panel glass-panel">
            <div class="pantry-grid">
                <div class="ing-item"><span>🍜 Noodles: <b id="inv-noodle">0</b></span><button onclick="buyIngredient('noodle', 10, 5)">Buy 10 ($5)</button></div>
                <div class="ing-item"><span>🥣 Broth: <b id="inv-broth">0</b></span><button onclick="buyIngredient('broth', 10, 5)">Buy 10 ($5)</button></div>
                <div class="ing-item"><span>🧂 Spice: <b id="inv-spice">0</b></span><button onclick="buyIngredient('spice', 10, 2)">Buy 10 ($2)</button></div>
                <div class="ing-item"><span>🥚 Eggs: <b id="inv-egg">0</b></span><button onclick="buyIngredient('egg', 10, 8)">Buy 10 ($8)</button></div>
            </div>
        </div>

        <div class="restaurant-floor glass-panel">
            <div id="view-dining" class="view-panel active-view">
                <div id="dining-area"></div>
            </div>
            <div id="view-kitchen" class="view-panel hidden-view">
                <div id="stoves-container"></div>
            </div>
            <div id="view-staff" class="view-panel hidden-view">
                <div class="pad-container" id="staff-container"></div>
            </div>
        </div>

        <div class="tycoon-section glass-panel">
            <div class="pad-container">
                <div id="pad-table" class="pad-slot"></div>
                <div id="pad-recipe" class="pad-slot"></div>
                <div id="pad-auto" class="pad-slot"></div>
            </div>
            <button class="reset-btn" style="margin-top:20px; opacity:0.5;" onclick="resetGame()">Hard Reset</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
