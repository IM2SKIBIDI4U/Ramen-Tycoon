<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen Tycoon: VIP Kitchen Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🍜 Ultimate Ramen Tycoon</h1>
        
        <div class="top-bar">
            <div class="wallet-display">Wallet: <span id="money" style="color:#00b894;">$0</span></div>
            <div class="stats-box">
                <p>Menu: <b id="stat-menu">Basic ($50)</b></p>
            </div>
        </div>

        <div class="restaurant-floor">
            <div id="kitchen-area">
                <div class="kitchen-title">🔥 THE KITCHEN 🔥</div>
                <div id="stoves-container">
                    </div>
            </div>

            <div id="dining-area">
                </div>
        </div>

        <div class="tycoon-section">
            <h3>🔴 Upgrades</h3>
            <div class="pad-container">
                <div id="pad-table" class="pad-slot"></div>
                <div id="pad-recipe" class="pad-slot"></div>
                <div id="pad-auto" class="pad-slot"></div>
            </div>
            <button class="reset-btn" onclick="resetGame()">Hard Reset</button>
        </div>
        
        <div style="margin-top: 15px; color: #aaa; font-size: 0.8rem;">Type 'rafay' for Admin Panel</div>
    </div>

    <div id="admin-panel" class="hidden">
        <h2 style="color: #00ff00;">👨‍💻 Boss Rafay's Terminal</h2>
        <div class="admin-grid">
            <button class="tycoon-pad affordable" onclick="cheatMoney(1000000)">+$1 Million</button>
            <button class="tycoon-pad affordable track-mult" onclick="cheatMoney(1000000000000)">+$1 Trillion</button>
            <button class="tycoon-pad affordable track-table" onclick="adminMaxTables()">Max Tables</button>
        </div>
        <button class="reset-btn" style="color: #ff4d4d; margin-top: 15px;" onclick="closeAdmin()">Close Terminal</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
