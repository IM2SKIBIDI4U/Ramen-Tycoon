<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen Monkey Tycoon: Mega-Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default" id="body-tag">
    <div id="event-toast" class="event-toast hidden">🚨 RUSH HOUR! 2X PAY! 🚨</div>
    <div id="save-toast" class="save-toast">💾 Game Saved!</div>

    <div class="game-container">
        <h1>🍜 Ramen Monkey Tycoon</h1>
        
        <div class="top-bar glass-panel">
            <div class="wallet-display">Wallet: <span id="money" style="color:#05c46b;">$0</span></div>
            <div class="stats-box">
                Menu: <b id="stat-menu">Basic Shoyu</b><br>
                <span style="color:#0984e3; font-size:0.9rem;">🗺️ Turf Multiplier: <b id="stat-turf">1.0</b>x</span>
            </div>
        </div>

        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('dining')">🍽️ Dining</button>
            <button class="tab-btn" onclick="switchTab('kitchen')">🔥 Kitchen</button>
            <button class="tab-btn" onclick="switchTab('upgrades')">🚀 Shop</button>
            <button class="tab-btn" onclick="switchTab('staff')">🐒 Staff</button>
            <button class="tab-btn" onclick="switchTab('map')">🗺️ Map</button>
            <button class="tab-btn" onclick="switchTab('decor')">🎨 Decor</button>
        </div>

        <div class="pantry-panel glass-panel">
            <div class="pantry-grid">
                <div class="ing-item"><span>🍜 Noodle: <b id="inv-noodle">0</b></span><button onclick="buyIngredient('noodle', 10, 5)">Buy 10 ($5)</button></div>
                <div class="ing-item"><span>🥣 Broth: <b id="inv-broth">0</b></span><button onclick="buyIngredient('broth', 10, 5)">Buy 10 ($5)</button></div>
                <div class="ing-item"><span>🧂 Spice: <b id="inv-spice">0</b></span><button onclick="buyIngredient('spice', 10, 2)">Buy 10 ($2)</button></div>
                <div class="ing-item"><span>🥚 Egg: <b id="inv-egg">0</b></span><button onclick="buyIngredient('egg', 10, 8)">Buy 10 ($8)</button></div>
            </div>
        </div>

        <div class="restaurant-floor glass-panel">
            <div id="view-dining" class="view-panel active-view"><div id="dining-area"></div></div>
            <div id="view-kitchen" class="view-panel hidden"><div id="stoves-container"></div></div>
            <div id="view-upgrades" class="view-panel hidden"><div class="pad-container" id="upgrades-list"></div></div>
            <div id="view-staff" class="view-panel hidden"><div class="pad-container" id="staff-list"></div></div>
            <div id="view-map" class="view-panel hidden"><div id="map-grid"></div></div>
            <div id="view-decor" class="view-panel hidden"><div class="pad-container" id="decor-list"></div></div>
        </div>
        
        <button class="reset-btn" onclick="resetGame()">Hard Reset Data</button>
    </div>

    <div id="admin-panel" class="hidden">
        <h2 style="color:#00ff00; margin-bottom: 15px;">👑 GOD MODE ACTIVE</h2>
        <div class="admin-grid">
            <button onclick="game.wallet += 1000000; updateUI();">💰 +$1M Cash</button>
            <button onclick="game.inv = {noodle:999, broth:999, spice:999, egg:999}; updateUI();">📦 Infinite Stock</button>
            <button id="btn-speed-hack" onclick="toggleSpeedHack()">🏃 Speed Hack: OFF</button>
            <button onclick="adminInstantCook()">⚡ Instant Cook All</button>
            <button class="admin-close" onclick="document.getElementById('admin-panel').classList.add('hidden')">Close Menu</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
