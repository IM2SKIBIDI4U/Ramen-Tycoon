<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen Tycoon: Master Chef Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🍜 Ultimate Ramen Tycoon</h1>
        
        <div class="top-bar">
            <div class="wallet-display">Wallet: <span id="money" style="color:#00b894;">$0</span></div>
            <div class="stats-box">Menu: <b id="stat-menu">Basic ($50)</b></div>
        </div>

        <div class="pantry-panel">
            <h3>🛒 Ingredients Market</h3>
            <div class="pantry-grid">
                <div class="ing-item">
                    <span>🍜 Noodles: <b id="inv-noodle">0</b></span>
                    <button onclick="buyIngredient('noodle', 10, 5)">Buy 10 ($5)</button>
                </div>
                <div class="ing-item">
                    <span>🥣 Broth: <b id="inv-broth">0</b></span>
                    <button onclick="buyIngredient('broth', 10, 5)">Buy 10 ($5)</button>
                </div>
                <div class="ing-item">
                    <span>🧂 Seasoning: <b id="inv-spice">0</b></span>
                    <button onclick="buyIngredient('spice', 10, 2)">Buy 10 ($2)</button>
                </div>
                <div class="ing-item">
                    <span>🥚 Eggs: <b id="inv-egg">0</b></span>
                    <button onclick="buyIngredient('egg', 10, 8)">Buy 10 ($8)</button>
                </div>
            </div>
            <div id="out-of-stock-msg" class="hidden" style="color: #d63031; font-weight: bold; margin-top: 5px;">⚠️ OUT OF INGREDIENTS! ⚠️</div>
        </div>

        <div class="restaurant-floor">
            <div id="kitchen-area">
                <div class="kitchen-title">🔥 THE KITCHEN 🔥</div>
                <div id="stoves-container">
                    </div>
            </div>

            <div id="dining-area">
                </div>
        </div>

        <div class="tycoon-section">
            <h3>🔴 Upgrades</h3>
            <div class="pad-container">
                <div id="pad-table" class="pad-slot"></div>
                <div id="pad-recipe" class="pad-slot"></div>
                <div id="pad-auto" class="pad-slot"></div>
            </div>
            <button class="reset-btn" onclick="resetGame()">Hard Reset</button>
        </div>
        
        <div style="margin-top: 15px; color: #aaa; font-size: 0.8rem;">Type 'rafay' for Admin Panel</div>
    </div>

    <div id="admin-panel" class="hidden">
        <h2 style="color: #00ff00;">👨‍💻 Boss Rafay's Terminal</h2>
        <div class="admin-grid">
            <button class="tycoon-pad affordable" onclick="cheatMoney(1000000)">+$1 Million</button>
            <button class="tycoon-pad affordable track-mult" onclick="cheatMoney(1000000000000)">+$1 Trillion</button>
            <button class="tycoon-pad affordable" onclick="adminMaxIngredients()">Max Ingredients</button>
            <button class="tycoon-pad affordable track-table" onclick="adminMaxTables()">Max Tables</button>
        </div>
        <button class="reset-btn" style="color: #ff4d4d; margin-top: 15px;" onclick="closeAdmin()">Close Terminal</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
